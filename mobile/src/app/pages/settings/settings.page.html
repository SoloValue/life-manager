<form
  [formGroup]="config"
  (ngSubmit)="onSubmit()"
  class="flex flex-col gap-6 p-4 max-w-md mx-auto"
>
  @for (group of configIterable(); track $index) {
  <div [formGroupName]="group[0]" class="bg-zinc-600/60 rounded-lg px-3 py-4">
    <legend class="text-lg font-semibold mb-3">{{ group[0] }}</legend>
    @for (item of group[1]; track $index) {
    <div class="flex flex-col gap-1 mb-4">
      <label class="block text-sm/6 text-(--text-color) font-medium"
        >{{ item[0] }}</label
      >
      <input
        type="text"
        [formControlName]="item[0]"
        class="block w-full rounded-lg bg-white/5 px-3 py-1.5 text-base outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-violet-500"
      />
    </div>
    }
  </div>
  }
</form>
