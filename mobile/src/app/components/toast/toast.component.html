<div class="fixed top-4 right-4 z-50 flex flex-col gap-3 w-80 pointer-events-none">

  @for (toast of toasts(); track trackById($index, toast)) {
    <div
      class="pointer-events-auto flex items-start gap-3 rounded-lg border-l-4 px-4 py-3 shadow-lg
             transition-all duration-300 animate-slide-in"
      [ngClass]="colorClasses(toast)"
      role="alert"
      aria-live="assertive"
    >
      <!-- Status icon -->
      <svg
        class="mt-0.5 h-5 w-5 shrink-0"
        [ngClass]="iconClasses(toast)"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="iconPath(toast)" />
      </svg>

      <!-- Text content -->
      <div class="flex-1 min-w-0">
        <p class="text-sm font-semibold leading-tight">{{ toast.title }}</p>
        <p class="mt-0.5 text-sm opacity-80 break-words">{{ toast.message }}</p>
      </div>

      <!-- Close button -->
      <button
        type="button"
        class="ml-auto shrink-0 rounded p-0.5 opacity-60 hover:opacity-100 focus:outline-none
               focus:ring-2 focus:ring-current transition-opacity"
        (click)="dismiss(toast.id)"
        aria-label="Close notification"
      >
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  }

</div>
